services:
  db:
    image: postgres:16
    container_name: event_parser_db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nats:
    image: nats:latest
    container_name: nats_broker
    restart: always
    ports:
      - "4222:4222"
      - "8222:8222"
    command:
      - "-js"
      - "--store_dir"
      - "/data/jetstream"
      - "--http_port"
      - "8222"
      - "--debug"
    volumes:
      - nats_data:/data/jetstream

  app:
    build: .
    container_name: event_app
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - nats
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  worker:
    build: .
    container_name: event_worker
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - nats
    command: python -m app.workers.ingest_worker

volumes:
  postgres_data:
  nats_data:
