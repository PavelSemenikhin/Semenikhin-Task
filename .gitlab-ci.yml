include:
  - template: Auto-DevOps.gitlab-ci.yml


flake8:
  stage: test
  image: python:3.12-slim
  variables:
    POETRY_VIRTUALENVS_CREATE: "false"
  script:
    - pip install poetry
    - poetry install --only dev --no-root
    - poetry run flake8 .

black:
  stage: test
  image: python:3.12-slim
  variables:
    POETRY_VIRTUALENVS_CREATE: "false"
  script:
    - pip install poetry
    - poetry install --only dev --no-root
    - poetry run black --check .


tests:
  stage: test
  image: python:3.12-slim

  services:
    - name: postgres:15
      alias: db
    - name: nats:2.10
      alias: nats


  variables:
    POSTGRES_DB: db
    POSTGRES_USER: user
    POSTGRES_PASSWORD: pass
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    DATABASE_URL: postgres://user:pass@db:5432/db
    NATS_URL: nats://nats:4222

  script:
    - pip install poetry
    - poetry install  --no-root
    - sleep 7
    - poetry run pytest -v
