include:
  - template: Auto-DevOps.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml


flake8:
  stage: test
  image: python:3.12-slim
  variables:
    POETRY_VIRTUALENVS_CREATE: "false"
  script:
    - pip install poetry
    - poetry install --only dev --no-root
    - poetry run flake8 .

black:
  stage: test
  image: python:3.12-slim
  variables:
    POETRY_VIRTUALENVS_CREATE: "false"
  script:
    - pip install poetry
    - poetry install --only dev --no-root
    - poetry run black --check .


container_scan_gate:
  stage: test
  image:
    name: aquasec/trivy:0.67.2
    entrypoint: [""]
  services:
    - docker:26.1.3-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TRIVY_NO_PROGRESS: "true"
  script:
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  needs:
    - build
  allow_failure: false


tests:
  stage: test
  image: python:3.12-slim
  needs:
    - ["build", "black", "flake8", "container_scan_gate"]

  services:
    - name: postgres:15
      alias: db
    - name: nats:2.10
      alias: nats


  variables:
    POSTGRES_DB: db
    POSTGRES_USER: user
    POSTGRES_PASSWORD: pass
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    DATABASE_URL: postgres://user:pass@db:5432/db
    NATS_URL: nats://nats:4222

  script:
    - pip install poetry
    - poetry install  --no-root
    - sleep 7
    - poetry run pytest -v
