stages:
  - lint
  - tests
  - build
  - security

default:
  image: python:3.12-slim
  before_script:
    - pip install poetry
    - poetry config virtualenvs.create false
    - poetry install --no-root


flake8:
  stage: lint
  script:
    - echo "Checking lint with flake8"
    - poetry run flake8 .
  allow_failure: false

black:
  stage: lint
  script:
    - echo "Checking lint with black"
    - poetry run black --check .
  allow_failure: false

tests:
  stage: tests
  image: python:3.12-slim
  services:
    - name: postgres:15
      alias: db
    - name: nats:2.10
      alias: nats
  script:
    - echo "Running tests"
    - docker compose exec app pytest -v
  needs:
    - flake8
    - black
  allow_failure: false

build_image:
  stage: build
  image: docker:26.1.3
  services:
    - docker:26.1.3-dind
  script:
    - echo "Building image $CONTAINER_IMAGE"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CONTAINER_IMAGE .
    - docker push $CONTAINER_IMAGE
  when: manual
  allow_failure: false