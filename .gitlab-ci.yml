include:
  - template: Auto-DevOps.gitlab-ci.yml


stages:
  - test


flake8:
  stage: test
  image: python:3.12-slim
  variables:
    POETRY_VIRTUALENVS_CREATE: "false"
  script:
    - pip install poetry
    - poetry install --only dev --no-root
    - poetry run flake8 .


black:
  stage: test
  image: python:3.12-slim
  variables:
    POETRY_VIRTUALENVS_CREATE: "false"
  script:
    - pip install poetry
    - poetry install --only dev --no-root
    - poetry run black --check .


tests:
  stage: test
  image: python:3.12-slim

  services:
    - name: postgres:15
      alias: db


  variables:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgres://user:pass@db:5432/db

  script:
    - pip install poetry
    - poetry install  --no-root
    - poetry run pytest -v

